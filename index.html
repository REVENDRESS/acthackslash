                            this.isGuardBroken = true;
                            this.canBeFatalNow = true;
                            
                            // Hit Stop Duration
                            // ブレイク時は演出重視で固定値長めにするか、customHitStopを使うか
                            // ここではブレイク演出優先で300ms固定とするが、customHitStopが極端に長ければそちら優先も検討
                            const stopDuration = 300;
                            
                            const guardBreakDuration = 3000 + stopDuration;
                            this.guardBreakTimer = guardBreakDuration;
                            this.guardBreakMax = guardBreakDuration;
                            
                            // this.setTint(0x888888); // Removed in favor of blinking
                            this.startBreakEffect(); // Start Red Blinking
                            this.scene.showDamagePopup(this.x, this.y - 60, "BREAK!", "#ffff00");
                            this.scene.spawnBreakParticles(this.x, this.y, 30);
                            this.cancelAttack();
                            // Add Hit Stop for Guard Break
                            this.scene.hitStop(stopDuration);

                            // ブレイク瞬間の強制ノックバック（ヒットストップ中も動くように手動制御）
                            const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.x, this.y);
                            const force = 400; 
                            this.forceMoveVelocity = {
                                x: Math.cos(angle) * force,
                                y: Math.sin(angle) * force
                            };
                            
                            this.state = 'KNOCKBACK';
                            this.setVelocity(0); // 物理移動はキャンセル（手動制御に任せる）
                            
                            this.scene.time.delayedCall(300, () => {
                                if (!this.active) return;
                                if (this.hp > 0) {
                                    // ノックバック終了
                                    // ブレイク中はupdateで制御されるのでstateは何でも良いが、KNOCKBACK以外にする
                                    this.state = 'IDLE'; 
                                    this.setVelocity(0);
                                }
                            });
                        }

                        // Reduce Damage (Hard skin)
                        finalDamage = Math.ceil(amount * 0.1);
                    } else {
                        // Guard Broken: Critical Damage
                        finalDamage = amount * 2;
                        isCritical = true;
                    }
                }

                this.hp -= finalDamage;

                if (this.scene && typeof this.scene.registerEnemyDamage === 'function' && finalDamage > 0) {
                    this.scene.registerEnemyDamage(finalDamage);
                }
                
                if (this.type === 'tiny') {
                    this.anims.play('rat_hit', true);
                } else if (this.type === 'spearman' || this.type === 'yari_goblin') {
                    const hitAnimKey = this.type === 'yari_goblin' ? 'goblin_green_hit' : 'goblin_hit';
                    this.anims.play(hitAnimKey, true);
                }

                // ダメージ表示
                let color = '#ffffff';
                if (isCritical) color = '#ff0000';
                else if (isPlayerCritical) color = '#ffff00';
                const displayText = (isCritical || isPlayerCritical) ? finalDamage + "!" : finalDamage;
                this.scene.showDamagePopup(this.x, this.y - 40, displayText, color);

                // ボクセル欠損エフェクト
                this.chipBody();

                // Normal hit flash (skip if blinking for break)
                if (!this.isGuardBroken) {
                    this.setTintFill(0xffffff); // Use setTintFill for solid white flash
                    this.scene.time.delayedCall(100, () => {
                        if (this.active) {
                            if ((this.type === 'large' || this.type === 'charger') && this.isGuardBroken) {
                                // Ignore, blinking handles it
                            } else if (this.type === 'charger') {
                                this.clearTint();
                            } else if (this.type === 'tiny') {
                                this.setTint(0xffaaaa);
                            } else {
                                this.clearTint(); // Restore to original color (Green for goblin/spearman, None for large)
                            }
                        }
                    });
                }

                if (this.hp <= 0) {
                    if (this.scene && typeof this.scene.registerEnemyKill === 'function') {
                        this.scene.registerEnemyKill();
                    }
                    // ヒットストップ（死亡時：トドメの強調）
                    // 一般的なアクションゲームの強打撃基準：約7フレーム = 120ms
                    this.scene.hitStop(200);

                    // 覚醒攻撃でトドメを刺した場合、HPを最大値の10%回復
                    if (this.player && this.player.isEmpowered) {
                        this.player.recoverHealth(this.player.maxHp * 0.1);
                    }

                    this.cancelAttack();
                    if (this.weapon) this.weapon.destroy(); // 武器削除
                    this.hpBar.destroy();
                    if (this.staminaBar) this.staminaBar.destroy(); // SPゲージ削除
                    // 死亡時に肉片を撒き散らす
                    const scale = this.type === 'tiny' ? 0.5 : 1.0;
                    this.scene.spawnGore(this.x, this.y, 0xaa0000, scale);

                    // Gold Drop (1-500)
                    const goldAmount = Phaser.Math.Between(1, 500);
                    this.scene.spawnGold(this.x, this.y, goldAmount);

                    // Item Drop Test (50% chance)
                    if (Phaser.Math.Between(0, 100) < 50) {
                        const type = Phaser.Math.Between(0, 1) === 0 ? 'weapon' : 'shield';
                        // Use scene factory if available, or direct instantiation
                        // Since ItemDrop is a class in this file, we can instantiate it.
                        // However, we need to make sure 'ItemDrop' class is accessible here. 
                        // It is defined in the same scope (script tag).
                        const drop = new ItemDrop(this.scene, this.x, this.y, type);
                        this.scene.items.add(drop);
                        drop.playDropEffect();
                    }

                    this.destroy();
                } else {
                    // 生存時のヒットストップ（攻撃の重さ表現）
                    let stopDuration = 0;

                    if (this.player && this.player.isEmpowered) {
                        // 覚醒時（RB長押し）：重厚感のあるヒットストップ
                        // 覚醒時もcustomHitStopがあればそれを使うが、覚醒補正をかけたい場合もある
                        // ここではcustomHitStopがあれば優先する
                        if (customHitStop > 0) {
                            stopDuration = customHitStop;
                        } else {
                            if (attackType === 'light') {
                                stopDuration = 100;  // 通常強攻撃並み
                            } else {
                                stopDuration = 200; // かなり重い
                            }
                        }
                    } else {
                        // 通常時
                        if (customHitStop > 0) {
                            stopDuration = customHitStop;
                        } else {
                            // フォールバック（古い呼び出し方など）
                            if (attackType === 'light') {
                                stopDuration = 30; // 軽快に
                            } else {
                                stopDuration = 100;
                            }
                        }
                    }

                    if (stopDuration > 0) {
                        this.scene.hitStop(stopDuration);
                    }
                }
            }

            takeFatalDamage(source, attackType = 'light') {
                if (!this.isGuardBroken) return;
                if (!this.active) return;

                this.canBeFatalNow = false;

                const fatalBase = this.maxHp * 2;
                let firstDamage = Math.floor(fatalBase / 2);
                if (firstDamage >= this.hp) {
                    firstDamage = Math.max(this.hp - 1, 0);
                }

                if (firstDamage > 0) {
                    this.hp -= firstDamage;
                    if (this.hp <= 0) {
                        this.hp = 1;
                    }

                    if (this.scene && this.scene.showDamagePopup) {
                        this.scene.showDamagePopup(this.x, this.y - 40, firstDamage, '#ff0000');
                    }

                    this.chipBody();
                }

                if (this.armorBlinkTween) {
                    this.armorBlinkTween.stop();
                    this.armorBlinkTween = null;
                }

                if (this.breakEvent) {
                    this.breakEvent.remove();
                    this.breakEvent = null;
                }

                this.setTint(0xff0000);
                this.setAlpha(1);

                this.pendingFatalAttackType = attackType;
                this.stamina = this.maxStamina;
            }

            finishFatalDamage() {
                if (!this.active) return;

                const attackType = this.pendingFatalAttackType || 'light';
                const fatalBase = this.maxHp * 2;
                const stopDuration = 200;

                this.takeDamage(fatalBase, attackType, stopDuration, true);

                if (this.scene && this.scene.showText) {
                    this.scene.showText('FATAL');
                }

                this.pendingFatalAttackType = null;
            }

            chipBody() {
                if (!this.voxelMaskRT) return;

                // ランダムに数箇所欠けさせる (1〜3個)
                const chips = Phaser.Math.Between(1, 3);
                
                // Use ERASE blend mode to remove alpha (create holes)
                const eraser = this.scene.make.graphics({ add: false });
                eraser.fillStyle(0x000000, 1);
                eraser.fillRect(0, 0, 4, 4);

                for (let i = 0; i < chips; i++) {
                    const rx = Phaser.Math.Between(0, 28);
                    const ry = Phaser.Math.Between(0, 28);
                    
                    // Draw with ERASE blend mode -> Alpha becomes 0
                    this.voxelMaskRT.draw(eraser, rx, ry, 1, 0xffffff, Phaser.BlendModes.ERASE);
                }
                
                eraser.destroy();
            }

            destroy(fromScene) {
                if (this.voxelMaskRT) this.voxelMaskRT.destroy();
                if (this.voxelMaskImg) this.voxelMaskImg.destroy();
                if (this.voxelMask) this.voxelMask.destroy();
                if (this.hpBar) this.hpBar.destroy();
                if (this.staminaBar) this.staminaBar.destroy();
                if (this.weapon) this.weapon.destroy();
                
                super.destroy(fromScene);
            }
        }

        class ItemDrop extends Phaser.Physics.Arcade.Sprite {
            constructor(scene, x, y, type, itemData = null) {
                super(scene, x, y, 'item_texture'); // Use item_texture
                
                this.itemType = type; // 'weapon' or 'shield'
                this.auraParticles = null;
                
                // Initialize Item Data
                if (itemData) {
                    this.itemData = itemData;
                } else {
                    // Generate Random Stats if no data provided
                    const rarityRoll = Phaser.Math.Between(0, 100);
                    let rarity = RARITY.NORMAL;
                    if (rarityRoll > 95) rarity = RARITY.LEGENDARY; // 5%
                    else if (rarityRoll > 80) rarity = RARITY.EPIC; // 15%
                    else if (rarityRoll > 50) rarity = RARITY.RARE; // 30%
                    
                    // Select Random ID
                    let typeId;
                    let baseStats;
                    
                    if (type === 'weapon') {
                        const ids = Object.keys(WEAPON_TYPES);
                        typeId = ids[Phaser.Math.Between(0, ids.length - 1)];
                        baseStats = WEAPON_TYPES[typeId];
                    } else {
                        const ids = Object.keys(SHIELD_TYPES);
                        typeId = ids[Phaser.Math.Between(0, ids.length - 1)];
                        baseStats = SHIELD_TYPES[typeId];
                    }

                    this.itemData = {
                        id: Date.now() + Math.random().toString(36).substr(2, 9),
                        typeId: typeId,
                        type: type,
                        rarity: rarity,
                        name: this.generateName(baseStats.name, rarity),
                        attackPower: type === 'weapon' ? Math.floor(baseStats.baseAttack * (1 + rarity * 0.5) + Phaser.Math.Between(0, 3)) : 0,
                        attackSpeed: type === 'weapon' ? parseFloat((baseStats.baseSpeed + (rarity * 0.1)).toFixed(2)) : 0,
                        size: type === 'weapon' ? parseFloat((baseStats.baseSize + (rarity * 0.1)).toFixed(2)) : 1.0,
                        options: []
                     };

                    if (type === 'shield') {
                        // Base stats
                        let hardness = baseStats.baseHardness;
                        let thickness = baseStats.baseThickness;
                        let weight = baseStats.baseWeight;
                        
                        // Rarity bonus (random variance increasing with rarity)
                        const bonusMin = rarity; 
                        const bonusMax = rarity * 2 + 1;
                        
                        hardness += Phaser.Math.Between(bonusMin, bonusMax);
                        thickness += Phaser.Math.Between(bonusMin, bonusMax);
                        weight += Phaser.Math.Between(bonusMin, bonusMax);

                        this.itemData.hardness = hardness;
                        this.itemData.thickness = thickness;
                        this.itemData.weight = weight;
                    }
                    
                    const countRoll = () => {
                        if (this.itemData.rarity === RARITY.NORMAL) {
                            return Phaser.Math.Between(0, 100) < 30 ? 1 : 0;
                        } else if (this.itemData.rarity === RARITY.RARE) {
                            return Phaser.Math.Between(0, 100) < 30 ? 2 : 1;
                        } else if (this.itemData.rarity === RARITY.EPIC) {
                            return Phaser.Math.Between(0, 100) < 30 ? 3 : 2;
                        } else {
                            const r = Phaser.Math.Between(1, 100);
                            if (r <= 5) return 4;
                            if (r <= 15) return 3;
                            if (r <= 40) return 2;
                            return 1;
                        }
                    };
                    const optCount = countRoll();
                    const pool = [
                        { key: 'attackPower', label: 'ちから', unit: '', type: 'weapon' },                 // 1: 1-10
                        { key: 'attackSpeed', label: 'そくど', unit: '', type: 'weapon' },                 // 2: -2.0 - 2.0
                        { key: 'size', label: 'でかさ', unit: '', type: 'weapon' },                        // 3: -2.0 - 2.0
                        { key: 'attackSpCostReduction', label: '攻撃SP消費率', unit: '%', type: 'any' },   // 4: 1-10 (表示は-)
                        { key: 'spDamagePlus', label: 'SPダメージ', unit: '', type: 'any' },               // 5: 1-10
                        { key: 'critChanceBonus', label: 'クリティカル発生率', unit: '%', type: 'any' },   // 6: 5-15
                        { key: 'critDamageBonus', label: 'クリティカルダメージ', unit: '%', type: 'any' }, // 7: 5-15
                        { key: 'hpBonus', label: 'HP', unit: '', type: 'any' },                            // 8: 1-50
                        { key: 'staminaBonus', label: 'SP', unit: '', type: 'any' },                       // 9: 1-10
                        { key: 'knockbackBonus', label: 'ノックバック', unit: '', type: 'weapon' },          // 10: 1-10
                        { key: 'moveSpeedBonus', label: 'いどうそくど', unit: '%', type: 'any' },          // 11: 5-15
                        { key: 'dashCostReduction', label: 'ダッシュSP消費', unit: '%', type: 'any' },      // 12: 5-15 (表示は-)
                        { key: 'staminaRegenBonus', label: 'SPかいふく', unit: '%', type: 'any' }          // 13: 5-15
                    ].filter(p => p.type === 'any' || p.type === this.itemData.type);
                    const ranges = (key) => {
                        if (key === 'attackPower') return [1, 10];
                        if (key === 'attackSpeed') return [-2.0, 2.0];
                        if (key === 'size') return [-0.5, 2.0];
                        if (key === 'attackSpCostReduction') return [1, 10];
                        if (key === 'spDamagePlus') return [1, 10];
                        if (key === 'critChanceBonus') return [5, 15];
                        if (key === 'critDamageBonus') return [5, 15];
                        if (key === 'hpBonus') return [1, 50];
                        if (key === 'staminaBonus') return [1, 10];
                        if (key === 'knockbackBonus') return [1, 10];
                        if (key === 'moveSpeedBonus') return [5, 15];
                        if (key === 'dashCostReduction') return [5, 15];
                        if (key === 'staminaRegenBonus') return [5, 15];
                        return [1, 1];
                    };
                    const used = new Set();
                    for (let i = 0; i < optCount && pool.length > 0; i++) {
                        let index = Phaser.Math.Between(0, pool.length - 1);
                        let tryCount = 0;
                        while (used.has(pool[index].key) && tryCount < 10) {
                            index = Phaser.Math.Between(0, pool.length - 1);
                            tryCount++;
                        }
                        used.add(pool[index].key);
                        const p = pool[index];
                        const [min, max] = ranges(p.key);
                        let val;
                        if (p.unit === '%') {
                            val = Math.floor(Phaser.Math.FloatBetween(min, max));
                        } else if (p.key === 'attackSpeed' || p.key === 'size') {
                            val = parseFloat(Phaser.Math.FloatBetween(min, max).toFixed(2));
                        } else {
                            val = Math.floor(Phaser.Math.FloatBetween(min, max));
                        }
                        this.itemData.options.push({ key: p.key, label: p.label, value: val, unit: p.unit });
                        if (p.key === 'attackPower') {
                            this.itemData.attackPower += val;
                        } else if (p.key === 'attackSpeed') {
                            this.itemData.attackSpeed = parseFloat((this.itemData.attackSpeed + val).toFixed(2));
                        } else if (p.key === 'size') {
                            this.itemData.size = parseFloat((this.itemData.size + val).toFixed(2));
                        } else if (p.key === 'critChanceBonus') {
                            this.itemData.critChanceBonus = (this.itemData.critChanceBonus || 0) + val;
                        } else if (p.key === 'critDamageBonus') {
                            this.itemData.critDamageBonus = (this.itemData.critDamageBonus || 0) + val;
                        } else if (p.key === 'knockbackBonus') {
                            this.itemData.knockbackBonus = (this.itemData.knockbackBonus || 0) + val;
                        } else if (p.key === 'hpBonus') {
                            this.itemData.hpBonus = (this.itemData.hpBonus || 0) + val;
                        } else if (p.key === 'staminaBonus') {
                            this.itemData.staminaBonus = (this.itemData.staminaBonus || 0) + val;
                        } else if (p.key === 'moveSpeedBonus') {
                            this.itemData.moveSpeedBonus = (this.itemData.moveSpeedBonus || 0) + val;
                        } else if (p.key === 'attackSpCostReduction') {
                            this.itemData.attackSpCostReduction = (this.itemData.attackSpCostReduction || 0) + val;
                        } else if (p.key === 'dashCostReduction') {
                            this.itemData.dashCostReduction = (this.itemData.dashCostReduction || 0) + val;
                        } else if (p.key === 'spDamagePlus') {
                            this.itemData.spDamagePlus = (this.itemData.spDamagePlus || 0) + val;
                        } else if (p.key === 'staminaRegenBonus') {
                            this.itemData.staminaRegenBonus = (this.itemData.staminaRegenBonus || 0) + val;
                        }
                    }
                }
                
                this.name = this.itemData.name;
                if (this.itemData && this.itemData.type === 'weapon') {
                    const candidate = WEAPON_TYPES[this.itemData.typeId]?.texture;
                    if (candidate && scene.textures.exists(candidate)) {
                        this.setTexture(candidate);
                    }
                } else if (this.itemData && this.itemData.type === 'shield') {
                    const shieldDef = SHIELD_TYPES[this.itemData.typeId];
                    const shieldTexture = shieldDef && shieldDef.texture;
                    if (shieldTexture && scene.textures.exists(shieldTexture)) {
                        this.setTexture(shieldTexture);
                    }
                }

                scene.add.existing(this);
                scene.physics.add.existing(this);
                
                // Physics Properties for Bouncing
                if (this.body) {
                    this.body.setBounce(0.6);
                    this.body.setDrag(100); // Stop eventually
                    this.body.setCollideWorldBounds(true);
                    // Radius 40 (Diameter 80) -> Expanded to 60 (Diameter 120) for easier pickup
                    // Offset: Center(16,16) - Center(30,30) = (-14, -14)
                    // Adjusted for visual centering (smaller circle)
                    // Radius 25 (Diameter 50)
                    // Previous Offset: 12, -2 (Center 37,23)
                    // New Offset: 12, 5 (Shifted +7 down) -> Center at 37,30
                    this.body.setCircle(25, 12, 5); 
                    
                    // Initial random push to separate if spawned together
                    this.setVelocity(Phaser.Math.Between(-50, 50), Phaser.Math.Between(-50, 50));
                }
                
                this.setDepth(25);
                this.setScale(0.8);
                
                if (this.itemData && this.itemData.type === 'weapon') {
                    const outlinedKey = getOutlinedWeaponTextureKey(scene, this.texture.key, this.itemData.rarity, true);
                    if (outlinedKey && scene.textures.exists(outlinedKey)) {
                        this.setTexture(outlinedKey);
                    }
                    this.clearTint();
                } else if (this.itemData && this.itemData.type === 'shield' && this.itemData.rarity >= RARITY.RARE) {
                    const outlinedKey = getOutlinedShieldTextureKey(scene, this.texture.key, this.itemData.rarity, true);
                    if (outlinedKey && scene.textures.exists(outlinedKey)) {
                        this.setTexture(outlinedKey);
                    }
                    this.clearTint();
                } else if (this.itemData && this.itemData.rarity !== undefined && RARITY_COLORS[this.itemData.rarity]) {
                    this.setTint(RARITY_COLORS[this.itemData.rarity]);
                }

                if (scene.textures.exists('spark')) {
                    const auraColor = RARITY_COLORS[this.itemData?.rarity] ?? 0xffffff;
                    const rarityVal = this.itemData?.rarity ?? 0;
                    // Scale particle count by rarity: Normal(0): 4, Rare(1): 8, Epic(2): 12, Legendary(3): 16
                    const particleQty = 4 + (rarityVal * 4);
                    
                    this.auraParticles = scene.add.particles(this.x, this.y, 'spark', {
                        speedX: { min: -5, max: 5 },
                        speedY: { min: -40, max: -20 },
                        scale: { start: 0.4, end: 0 },
                        alpha: { start: 0.4, end: 0 },
                        lifespan: { min: 400, max: 700 },
                        frequency: 40,
                        quantity: particleQty,
                        blendMode: 'ADD',
                        tint: auraColor,
                        emitZone: { type: 'random', source: new Phaser.Geom.Rectangle(-12, -12, 24, 24) }
                    });
                    this.auraParticles.setDepth(this.depth - 1);
                    this.once(Phaser.GameObjects.Events.DESTROY, () => {
                        if (this.auraParticles) {
                            this.auraParticles.destroy();
                            this.auraParticles = null;
                        }
                    });
                }
                
                // Bobbing animation
                this.bobTween = scene.tweens.add({
                    targets: this,
                    y: y - 5,
                    duration: 1000,
                    yoyo: true,
                    repeat: -1
                });

                // Interaction: Click to pickup
                this.setInteractive();
                this.on('pointerdown', () => {
                    if (scene.physics.overlap(this, scene.player)) {
                        if (scene.player.addToInventory(this.itemData)) {
                            this.destroy();
                        }
                    }
                });
            }

            preUpdate(time, delta) {
                super.preUpdate(time, delta);
                if (this.auraParticles) {
                    this.auraParticles.setPosition(this.x, this.y);
                }
            }

            onFatalTimeStopStart() {
                if (this.bobTween) {
                    this.bobTween.pause();
                }
                if (this.auraParticles) {
                    this.auraParticles.setVisible(false);
                }
            }

            onFatalTimeStopEnd() {
                if (this.bobTween) {
                    this.bobTween.resume();
                }
                if (this.auraParticles) {
                    this.auraParticles.setVisible(true);
                }
            }

            generateName(baseName, rarity) {
                return baseName;
            }

            playDropEffect() {
                // 敵がドロップしたときの演出
                // 武器の場合、レア度に応じた色のパーティクルを中央から拡散させる
                if (this.itemType !== 'weapon' || !this.itemData) return;

                const rarity = this.itemData.rarity ?? 0;
                const color = RARITY_COLORS[rarity] ?? 0xffffff;
                
                // レア度が高いほどパーティクルを増やす
                // Normal(0): 10, Rare(1): 20, Epic(2): 30, Legendary(3): 40
                const particleCount = (rarity + 1) * 10; 

                // 一旦非表示にする
                this.setVisible(false);
                this.setAlpha(0);
                if (this.auraParticles) this.auraParticles.setVisible(false);

                if (this.scene.textures.exists('spark')) {
                    const emitter = this.scene.add.particles(this.x, this.y, 'spark', {
                        speed: { min: 50, max: 150 },
                        angle: { min: 0, max: 360 },
                        scale: { start: 4, end: 0 }, // Scale increased for better visibility
                        alpha: { start: 1, end: 0 },
                        lifespan: 1000, // Slightly longer lifespan
                        tint: color,
                        blendMode: 'ADD',
                        quantity: particleCount,
                        emitting: false // Manual emit
                    });
                    
                    emitter.explode(particleCount);
                    
                    // 少し遅れて武器を表示（出現演出）
                    this.scene.time.delayedCall(200, () => {
                        this.setVisible(true);
                        if (this.auraParticles) this.auraParticles.setVisible(true);
                        
                        this.setScale(0); // 小さい状態から
                        
                        this.scene.tweens.add({
                            targets: this,
                            alpha: 1,
                            scale: 0.8, // 元のサイズに戻す
                            duration: 300,
                            ease: 'Back.out'
                        });
                    });

                    // Cleanup
                    this.scene.time.delayedCall(1200, () => {
                        emitter.destroy();
                    });
                } else {
                    this.setVisible(true);
                    this.setAlpha(1);
                    if (this.auraParticles) this.auraParticles.setVisible(true);
                }
            }
        }

                    orb._vx = def.vx;
                    orb._vy = def.vy;

                // 四辺ヴィネット（端を暗くしてオーブの発光を引き立てる）
                const vig = this.add.graphics().setDepth(3);
                vig.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.92, 0.92, 0, 0);
                vig.fillRect(0, 0, w, h * 0.4);
                vig.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0, 0, 0.92, 0.92);
                vig.fillRect(0, h * 0.6, w, h * 0.4);
                vig.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.7, 0, 0.7, 0);
                vig.fillRect(0, 0, w * 0.18, h);
                vig.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0, 0.7, 0, 0.7);
                vig.fillRect(w * 0.82, 0, w * 0.18, h);

                // 上昇するマジックパーティクル（65個）
                const sparkTints = [0xffffff, 0xaaddff, 0xddaaff, 0xffddaa, 0x88ffee];
                this._sparks = Array.from({ length: 65 }, () => {
                    const sp = this.add.image(
                        Phaser.Math.Between(0, w),
                        Phaser.Math.Between(0, h),
                        'title_spark'
                    ).setDepth(4).setBlendMode(Phaser.BlendModes.ADD);
                    sp.setTint(sparkTints[Phaser.Math.Between(0, sparkTints.length - 1)]);
                    sp.setAlpha(Phaser.Math.FloatBetween(0.3, 1.0));
                    sp.setScale(Phaser.Math.FloatBetween(0.3, 1.3));
                    sp._vy = Phaser.Math.FloatBetween(-90, -22);
                    sp._vx = Phaser.Math.FloatBetween(-12, 12);
                    sp._fadeRate = Phaser.Math.FloatBetween(0.1, 0.35);
                    return sp;
                });

                // ---- 背景アニメーション ここまで ----

                const title = this.add.text(centerX, centerY - 140, 'DUNGEON', {
                    fontFamily: 'x10y12pxDonguriDuel',
                    fontSize: '48px',
                    fontStyle: 'bold',
                    color: '#ffffff'
                }).setOrigin(0.5);
                title.setDepth(10);

                const menuTexts = ['はじめから', 'ロード', 'ゲームを終了'];
                const startY = centerY - 10;

                this.menuItems = menuTexts.map((text, i) => {
                    const t = this.add.text(centerX, startY + i * 40, text, {
                        fontFamily: 'x10y12pxDonguriDuel',
                        fontSize: '24px',
                        color: '#cccccc'
                    }).setOrigin(0.5);
                    t.setDepth(10);
                    return t;
                });

                this.updateMenuVisual();

                this.input.keyboard.on('keydown-UP', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-DOWN', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-W', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-S', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-ENTER', () => this.selectCurrent());
                this.input.keyboard.on('keydown-SPACE', () => this.selectCurrent());
                this.input.keyboard.on('keydown-Z', () => this.selectCurrent());

                this.prevConfirm = undefined;
                this.prevCancel = undefined;
                this.input.gamepad.on('connected', pad => {
                    this.gamepad = pad;
                });
            }

            moveCursor(dir) {
                const max = this.menuItems.length;
                this.menuIndex = (this.menuIndex + dir + max) % max;
                this.updateMenuVisual();
            }

            updateMenuVisual() {
                this.menuItems.forEach((item, i) => {
                    if (i === this.menuIndex) {
                        item.setColor('#ffffff');
                        item.setStyle({ fontStyle: 'bold' });
                    } else {
                        item.setColor('#777777');
                        item.setStyle({ fontStyle: 'normal' });
                    }
                });
            }

            selectCurrent() {
                const index = this.menuIndex;
                if (index === 0) {
                    this.scene.start('SaveSlotScene', { mode: 'new' });
                } else if (index === 1) {
                    this.scene.start('SaveSlotScene', { mode: 'load' });
                } else if (index === 2) {
                    this.game.destroy(true);
                }
            }

            update(time, delta) {
                const dt = delta / 1000;

                // グローオーブ更新（ゆっくり漂い、端で反射）
                if (this._orbs) {
                    const w = this.scale.width;
                    const h = this.scale.height;
                    this._orbs.forEach(orb => {
                        orb.x += orb._vx * dt;
                        orb.y += orb._vy * dt;
                        if (orb.x < -60 || orb.x > w + 60) orb._vx *= -1;
                        if (orb.y < -60 || orb.y > h + 60) orb._vy *= -1;
                    });
                }

                // マジックパーティクル更新（下から湧いて上へ消える）
                if (this._sparks) {
                    const w = this.scale.width;
                    const h = this.scale.height;
                    const sparkTints = [0xffffff, 0xaaddff, 0xddaaff, 0xffddaa, 0x88ffee];
                    this._sparks.forEach(sp => {
                        sp.x += sp._vx * dt;
                        sp.y += sp._vy * dt;
                        sp.setAlpha(sp.alpha - sp._fadeRate * dt);
                        if (sp.y < -10 || sp.alpha <= 0.04) {
                            sp.x = Phaser.Math.Between(0, w);
                            sp.y = Phaser.Math.Between(h + 5, h + 40);
                            sp._vy = Phaser.Math.FloatBetween(-90, -22);
                            sp._vx = Phaser.Math.FloatBetween(-12, 12);
                            sp._fadeRate = Phaser.Math.FloatBetween(0.1, 0.35);
                            sp.setTint(sparkTints[Phaser.Math.Between(0, sparkTints.length - 1)]);
                            sp.setAlpha(Phaser.Math.FloatBetween(0.5, 1.0));
                            sp.setScale(Phaser.Math.FloatBetween(0.3, 1.3));
                        }
                    });
                }

                const pads = this.input.gamepad.gamepads;
                if (pads && pads.length > 0 && this.time.now > (this.game.registry.get('_padTimer') || 0)) {
                    const pad = this.input.gamepad.getPad();
                    if (pad) {
                        const axisY = pad.axes.length > 1 ? pad.axes[1].getValue() : 0;
                        const threshold = 0.4;
                        if (axisY > threshold && this.prevAxisY <= threshold) {
                            this.moveCursor(1);
                        } else if (axisY < -threshold && this.prevAxisY >= -threshold) {
                            this.moveCursor(-1);
                        }
                        this.prevAxisY = axisY;

                        const up = pad.up;
                        const down = pad.down;

                        if (up && this.prevUp === false) {
                            this.moveCursor(-1);
                        }
                        if (down && this.prevDown === false) {
                            this.moveCursor(1);
                        }
                        this.prevUp = up;
                        this.prevDown = down;

                        const confirm = pad.A || pad.X;
                        if (confirm && this.prevConfirm === false) {
                            this.selectCurrent();
                        }
                        if (!this.prevConfirm && confirm) this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        this.prevConfirm = confirm;
                    }
                }
            }
        }

                    g.generateTexture('title_spark', 10, 10);
                    g.destroy();
                }

                // 暗い下地
                this.add.rectangle(0, 0, w, h, 0x050808, 1).setOrigin(0, 0).setDepth(0);

                // 背景グローオーブ（落ち着いた青緑系）
                const baseOrbDefs = [
                    { color: 0x1144aa, scale: 3.0, vx:  10, vy:  7 },
                    { color: 0x006644, scale: 2.2, vx: -12, vy: -9 },
                    { color: 0x223388, scale: 2.6, vx:   8, vy: 11 },
                ];
                this._baseOrbs = baseOrbDefs.map(def => {
                    const orb = this.add.image(
                        Phaser.Math.Between(80, w - 80),
                        Phaser.Math.Between(80, h - 80),
                        'title_orb'
                    ).setDepth(0).setTint(def.color).setAlpha(0.6).setScale(def.scale)
                     .setBlendMode(Phaser.BlendModes.ADD);
                    orb._vx = def.vx;
                    orb._vy = def.vy;
                    return orb;
                });

                // パネル（半透明にしてオーブが透けるように）
                const bg = this.add.rectangle(0, 0, w, h, 0x080d10, 0.88);
                bg.setOrigin(0, 0);
                bg.setDepth(1);

                const leftBg = this.add.rectangle(0, 0, leftWidth, h, 0x0e1318, 0.92);
                leftBg.setOrigin(0, 0);
                leftBg.setDepth(1);

                const rightBg = this.add.rectangle(leftWidth, 0, w - leftWidth, h, 0x111820, 0.92);
                rightBg.setOrigin(0, 0);
                rightBg.setDepth(1);

                // パネルの境界線（光る縦ライン）
                const divLine = this.add.graphics().setDepth(2);
                divLine.lineStyle(1, 0x334455, 0.8);
                divLine.beginPath();
                divLine.moveTo(leftWidth, 0);
                divLine.lineTo(leftWidth, h);
                divLine.strokePath();
                divLine.lineStyle(1, 0x446688, 0.3);
                divLine.beginPath();
                divLine.moveTo(leftWidth + 1, 0);
                divLine.lineTo(leftWidth + 1, h);
                divLine.strokePath();

                // 浮遊するダストパーティクル（全体、パネルより上のレイヤー）
                const dustTints = [0x4466aa, 0x336688, 0x225566, 0x557799, 0x334477];
                this._baseDust = Array.from({ length: 40 }, () => {
                    const sp = this.add.image(
                        Phaser.Math.Between(0, w),
                        Phaser.Math.Between(0, h),
                        'title_spark'
                    ).setDepth(3).setBlendMode(Phaser.BlendModes.ADD);
                    sp.setTint(dustTints[Phaser.Math.Between(0, dustTints.length - 1)]);
                    sp.setAlpha(Phaser.Math.FloatBetween(0.15, 0.45));
                    sp.setScale(Phaser.Math.FloatBetween(0.3, 0.9));
                    sp._vy = Phaser.Math.FloatBetween(-22, -6);
                    sp._vx = Phaser.Math.FloatBetween(-5, 5);
                    sp._fadeRate = Phaser.Math.FloatBetween(0.04, 0.12);
                    return sp;
                });

                const menuTitle = this.add.text(leftWidth / 2, 80, '拠点', {
                    fontFamily: 'x10y12pxDonguriDuel',
                    fontSize: '32px',
                    fontStyle: 'bold',
                    color: '#ffffff'
                }).setOrigin(0.5);
                menuTitle.setDepth(2);

                const startY = centerY - (menuDefs.length * 32) / 2;

                this.menuItems = menuDefs.map((def, i) => {
                    const t = this.add.text(leftWidth / 2, startY + i * 40, def.label, {
                        fontFamily: 'x10y12pxDonguriDuel',
                        fontSize: '22px',
                        color: '#777777'
                    }).setOrigin(0.5);
                    t.setDepth(2);
                    return t;
                });

                this.descriptionTitle = this.add.text(leftWidth + 40, 100, '', {
                    fontFamily: 'x10y12pxDonguriDuel',
                    fontSize: '26px',
                    fontStyle: 'bold',
                    color: '#ffffff',
                    wordWrap: { width: this.scale.width - leftWidth - 80 }
                });
                this.descriptionTitle.setDepth(2);

                this.descriptionText = this.add.text(leftWidth + 40, 150, '', {
                    fontFamily: 'x10y12pxDonguriDuel',
                    fontSize: '20px',
                    color: '#cccccc',
                    wordWrap: { width: this.scale.width - leftWidth - 80 }
                });
                this.descriptionText.setDepth(2);

                this.updateMenuVisual();
                this.updateDescription();

                this.input.keyboard.on('keydown-UP', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-DOWN', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-W', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-S', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-ENTER', () => this.selectCurrent());
                this.input.keyboard.on('keydown-SPACE', () => this.selectCurrent());
                this.input.keyboard.on('keydown-Z', () => this.selectCurrent());
                this.input.keyboard.on('keydown-ESC', () => this.backToTitle());
                this.input.keyboard.on('keydown-X', () => this.backToTitle());
                this.prevConfirm = undefined;
                this.prevCancel = undefined;
            }

            moveCursor(dir) {
                const max = this.menuItems.length;
                this.menuIndex = (this.menuIndex + dir + max) % max;
                this.updateMenuVisual();
                this.updateDescription();
            }

            updateMenuVisual() {
                this.menuItems.forEach((item, i) => {
                    if (i === this.menuIndex) {
                        item.setColor('#ffffff');
                        item.setStyle({ fontStyle: 'bold' });
                    } else {
                        item.setColor('#777777');
                        item.setStyle({ fontStyle: 'normal' });
                    }
                });
            }

            updateDescription() {
                const def = this.menuDefinitions[this.menuIndex];
                if (!def) return;
                this.descriptionTitle.setText(def.title);
                this.descriptionText.setText(def.description);
            }

            selectCurrent() {
                const index = this.menuIndex;
                const def = this.menuDefinitions[index];
                if (!def) return;
                if (def.label === 'ダンジョンへ向かう') {
                    this.scene.start('DungeonSelectScene', { slotIndex: this.slotIndex });
                } else if (def.label === '倉庫／ショップ') {
                    this.scene.start('WarehouseShopScene', { slotIndex: this.slotIndex });
                } else if (def.label === 'アリーナ') {
                    this.scene.start('ArenaScene', { slotIndex: this.slotIndex });
                } else if (def.label === 'オプション') {
                    this.showOptionInfo();
                } else if (def.label === 'タイトルへ戻る') {
                    this.backToTitle();
                }
            }

            showOptionInfo() {
                if (this.optionPopup) {
                    this.optionPopup.destroy();
                    this.optionPopup = null;
                }
                const w = 420;
                const h = 140;
                const x = this.scale.width / 2;
                const y = this.scale.height / 2;
                const container = this.add.container(0, 0);
                const bg = this.add.rectangle(x, y, w, h, 0x000000, 0.9);
                bg.setStrokeStyle(2, 0xffffff, 1);
                const text = this.add.text(x, y, 'オプションは今後追加予定。', {
                    fontFamily: 'x10y12pxDonguriDuel',
                    fontSize: '20px',
                    color: '#ffffff'
                }).setOrigin(0.5);
                container.add(bg);
                container.add(text);
                container.setDepth(20);
                this.optionPopup = container;
                this.time.delayedCall(1200, () => {
                    if (this.optionPopup) {
                        this.optionPopup.destroy();
                        this.optionPopup = null;
                    }
                });
            }

            backToTitle() {
                this.scene.start('TitleScene');
            }

            update(time, delta) {
                const dt = delta / 1000;

                // 背景オーブ更新
                if (this._baseOrbs) {
                    const w = this.scale.width;
                    const h = this.scale.height;
                    this._baseOrbs.forEach(orb => {
                        orb.x += orb._vx * dt;
                        orb.y += orb._vy * dt;
                        if (orb.x < -80 || orb.x > w + 80) orb._vx *= -1;
                        if (orb.y < -80 || orb.y > h + 80) orb._vy *= -1;
                    });
                }

                // ダストパーティクル更新
                if (this._baseDust) {
                    const w = this.scale.width;
                    const h = this.scale.height;
                    this._baseDust.forEach(sp => {
                        sp.x += sp._vx * dt;
                        sp.y += sp._vy * dt;
                        sp.setAlpha(sp.alpha - sp._fadeRate * dt);
                        if (sp.y < -10 || sp.alpha <= 0.01) {
                            const dustTints = [0x4466aa, 0x336688, 0x225566, 0x557799, 0x334477];
                            sp.x = Phaser.Math.Between(0, w);
                            sp.y = Phaser.Math.Between(h + 5, h + 35);
                            sp._vy = Phaser.Math.FloatBetween(-22, -6);
                            sp._vx = Phaser.Math.FloatBetween(-5, 5);
                            sp._fadeRate = Phaser.Math.FloatBetween(0.04, 0.12);
                            sp.setTint(dustTints[Phaser.Math.Between(0, dustTints.length - 1)]);
                            sp.setAlpha(Phaser.Math.FloatBetween(0.18, 0.5));
                            sp.setScale(Phaser.Math.FloatBetween(0.3, 0.9));
                        }
                    });
                }

                const pads = this.input.gamepad.gamepads;
                if (pads && pads.length > 0 && this.time.now > (this.game.registry.get('_padTimer') || 0)) {
                    const pad = this.input.gamepad.getPad();
                    if (pad) {
                        const axisY = pad.axes.length > 1 ? pad.axes[1].getValue() : 0;
                        const threshold = 0.4;
                        if (axisY > threshold && this.prevAxisY <= threshold) {
                            this.moveCursor(1);
                        } else if (axisY < -threshold && this.prevAxisY >= -threshold) {
                            this.moveCursor(-1);
                        }
                        this.prevAxisY = axisY;

                        const up = pad.up;
                        const down = pad.down;

                        if (up && this.prevUp === false) {
                            this.moveCursor(-1);
                        }
                        if (down && this.prevDown === false) {
                            this.moveCursor(1);
                        }
                        this.prevUp = up;
                        this.prevDown = down;

                        const confirm = pad.A || pad.X;
                        if (confirm && this.prevConfirm === false) {
                            this.selectCurrent();
                        }
                        const cancel = pad.B;
                        if (cancel && this.prevCancel === false) {
                            this.backToTitle();
                        }
                        if (!this.prevConfirm && confirm) this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        this.prevConfirm = confirm;
                        if (!this.prevCancel && cancel) this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        this.prevCancel = cancel;
                    }
                }
            }
        }

        class WarehouseShopScene extends Phaser.Scene {
            constructor() {
                super('WarehouseShopScene');
                this.slotIndex = 0;
                this.activePanel = 'inventory';
                this.inventoryCursor = 0;
                this.warehouseCursor = 0;
                this.inventory = [];
                this.equippedWeapon = null;
                this.equippedShield = null;
                this.prevAxisY = 0;
                this.prevAxisX = 0;
                this.prevConfirm = false;
                this.prevCancel = false;
                this.warningTimer = 0;
            }

            init(data) {
                this.slotIndex = data && typeof data.slotIndex === 'number' ? data.slotIndex : 0;
            }

            create() {
                this.loadFromStorage();

                const w = this.scale.width;
                const h = this.scale.height;
                const half = w / 2;
                this.W = w;
                this.H = h;

                const leftRoom = this.add.rectangle(0, 0, half - 2, h, 0x181822, 1).setOrigin(0, 0).setDepth(1);

                }).setOrigin(0.5).setDepth(2);

                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '24px', fontStyle: 'bold', color: '#ffffff'
                }).setOrigin(0.5).setDepth(2);

                this.equippedLabel = this.add.text(24, 68, '', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '14px', color: '#aaaaaa'
                }).setDepth(2);
                this.refreshEquippedLabel();

                this.itemListY = 110;

                this.warehouseRows = [];
                for (let i = 0; i < this.visibleRows; i++) {

                    const invText = this.add.text(28, y, '', {
                        fontFamily: 'x10y12pxDonguriDuel', fontSize: '16px', color: '#aaaaaa'
                    }).setDepth(2);
                    this.inventoryRows.push(invText);

                    const whText = this.add.text(half + 28, y, '', {
                        fontFamily: 'x10y12pxDonguriDuel', fontSize: '16px', color: '#aaaaaa'
                    }).setDepth(2);
                    this.warehouseRows.push(whText);
                }

                this.emptyInvText = this.add.text(half / 2, this.itemListY + 20, '空', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '20px', color: '#555566'
                }).setOrigin(0.5, 0).setDepth(2).setVisible(false);

                this.emptyWhText = this.add.text(half + half / 2, this.itemListY + 20, '空', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '20px', color: '#555566'
                }).setOrigin(0.5, 0).setDepth(2).setVisible(false);

                this.panelIndicatorLeft = this.add.text(half / 2, 14, '▼', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '12px', color: '#aaddff'
                }).setOrigin(0.5).setDepth(2).setVisible(false);

                this.panelIndicatorRight = this.add.text(half + half / 2, 14, '▼', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '12px', color: '#aaddff'
                }).setOrigin(0.5).setDepth(2).setVisible(false);

                this.warningText = this.add.text(w / 2, h / 2, '所持品がいっぱいです（最大8個）', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '20px', color: '#ff4444',
                    backgroundColor: '#000000', padding: { x: 16, y: 8 }
                }).setOrigin(0.5).setDepth(10).setVisible(false);

                this.add.text(w / 2, h - 22, '↑↓:選択  ←→:パネル切替  Enter/Z:移動  ESC/B:保存して戻る', {
                    fontFamily: 'x10y12pxDonguriDuel', fontSize: '14px', color: '#778899'
                }).setOrigin(0.5).setDepth(2);

                this.input.keyboard.on('keydown-ESC', () => this.saveAndBack());
                this.input.keyboard.on('keydown-X', () => this.saveAndBack());
                this.input.keyboard.on('keydown-UP', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-W', () => this.moveCursor(-1));
                this.input.keyboard.on('keydown-DOWN', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-S', () => this.moveCursor(1));
                this.input.keyboard.on('keydown-LEFT', () => this.switchPanel('inventory'));
                this.input.keyboard.on('keydown-A', () => this.switchPanel('inventory'));
                this.input.keyboard.on('keydown-RIGHT', () => this.switchPanel('warehouse'));
                this.input.keyboard.on('keydown-D', () => this.switchPanel('warehouse'));
                this.input.keyboard.on('keydown-ENTER', () => this.transferItem());
                this.input.keyboard.on('keydown-SPACE', () => this.transferItem());
                this.input.keyboard.on('keydown-Z', () => this.transferItem());

                this.refreshDisplay();
            }

            loadFromStorage() {
                const dataStr = localStorage.getItem('rogueSaveData');
                this.inventory = [];
                this.equippedWeapon = null;
                this.equippedShield = null;
                if (dataStr) {
                    try {
                        const data = JSON.parse(dataStr);
                        if (data.player) {
                            this.inventory = Array.isArray(data.player.inventory) ? data.player.inventory.slice() : [];
                            this.equippedWeapon = data.player.equippedWeapon || null;
                            this.equippedShield = data.player.equippedShield || null;
                        }
                        if (data.warehouse) {
                            WAREHOUSE[this.slotIndex] = data.warehouse.slice();
                        }
                    } catch (e) {}
                }
            }

            saveToStorage() {
                const dataStr = localStorage.getItem('rogueSaveData');
                let saveData = {};
                if (dataStr) {
                    try { saveData = JSON.parse(dataStr); } catch (e) {}
                }
                if (!saveData.player) {
                    saveData.player = {
                        hp: 100, maxHp: 100,
                        stamina: 100, maxStamina: 100,
                        potions: 3
                    };
                }
                saveData.player.inventory = this.inventory;
                saveData.warehouse = WAREHOUSE[this.slotIndex];
                localStorage.setItem('rogueSaveData', JSON.stringify(saveData));
            }

            refreshEquippedLabel() {
                let lines = [];
                if (this.equippedWeapon) {
                    const wt = WEAPON_TYPES[this.equippedWeapon.typeId];
                    const wname = wt ? wt.name : this.equippedWeapon.name || '?';
                    lines.push('装備武器: ' + wname);
                }
                if (this.equippedShield) {
                    const st = SHIELD_TYPES[this.equippedShield.typeId];
                    const sname = st ? st.name : this.equippedShield.name || '?';
                    lines.push('装備盾:　' + sname);
                }
                if (lines.length === 0) lines.push('装備なし');
                this.equippedLabel.setText(lines.join('\n'));
            }

            getItemColor(item) {
                const r = item.rarity ?? 0;
                const colorMap = { 0: '#aaaaaa', 1: '#4488ff', 2: '#aa44ff', 3: '#ffaa00' };
                return colorMap[r] || '#aaaaaa';
            }

            getItemLabel(item) {
                const typeLabel = item.type === 'weapon' ? '武' : '盾';
                const rarityLabel = RARITY_LABELS_JP[item.rarity ?? 0] || '';
                let stat = '';
                if (item.type === 'weapon') {
                    stat = item.attackPower !== undefined ? ' ATK' + item.attackPower : '';
                } else {
                    stat = item.hardness !== undefined ? ' DEF' + item.hardness : '';
                }
                return '[' + typeLabel + '] ' + (item.name || '?') + stat + ' ' + rarityLabel;
            }

            isEquipped(item) {
                if (!item || !item.id) return false;
                if (this.equippedWeapon && this.equippedWeapon.id === item.id) return true;
                if (this.equippedShield && this.equippedShield.id === item.id) return true;
                return false;
            }

            getScrollOffset(cursor, total) {
                const half = Math.floor(this.visibleRows / 2);
                let start = cursor - half;
                if (start < 0) start = 0;
                if (start + this.visibleRows > total) start = Math.max(0, total - this.visibleRows);
                return start;
            }

            refreshDisplay() {
                const inv = this.inventory;
                const wh = WAREHOUSE[this.slotIndex];

                const invOffset = this.getScrollOffset(this.inventoryCursor, inv.length);
                const whOffset = this.getScrollOffset(this.warehouseCursor, wh.length);

                this.emptyInvText.setVisible(inv.length === 0);
                this.emptyWhText.setVisible(wh.length === 0);

                for (let i = 0; i < this.visibleRows; i++) {
                    const invIdx = invOffset + i;
                    const whIdx = whOffset + i;
                    const invRow = this.inventoryRows[i];
                    const whRow = this.warehouseRows[i];

                    if (invIdx < inv.length) {
                        const item = inv[invIdx];
                        const isSelected = this.activePanel === 'inventory' && invIdx === this.inventoryCursor;
                        const equipped = this.isEquipped(item);
                        const label = this.getItemLabel(item) + (equipped ? ' ★' : '');
                        if (isSelected) {
                            invRow.setText('▶ ' + label).setColor('#ffffff').setStyle({ fontStyle: 'bold' });
                        } else if (equipped) {
                            invRow.setText('  ' + label).setColor('#888888').setStyle({ fontStyle: 'normal' });
                        } else {
                            invRow.setText('  ' + label).setColor(this.getItemColor(item)).setStyle({ fontStyle: 'normal' });
                        }
                        invRow.setVisible(true);
                    } else {
                        invRow.setText('').setVisible(false);
                    }

                    if (whIdx < wh.length) {
                        const item = wh[whIdx];
                        const isSelected = this.activePanel === 'warehouse' && whIdx === this.warehouseCursor;
                        const label = this.getItemLabel(item);
                        if (isSelected) {
                            whRow.setText('▶ ' + label).setColor('#ffffff').setStyle({ fontStyle: 'bold' });
                        } else {
                            whRow.setText('  ' + label).setColor(this.getItemColor(item)).setStyle({ fontStyle: 'normal' });
                        }
                        whRow.setVisible(true);
                    } else {
                        whRow.setText('').setVisible(false);
                    }
                }

                this.panelIndicatorLeft.setVisible(this.activePanel === 'inventory');
                this.panelIndicatorRight.setVisible(this.activePanel === 'warehouse');
            }

            moveCursor(dir) {
                if (this.activePanel === 'inventory') {
                    const max = this.inventory.length - 1;
                    if (max < 0) return;
                    this.inventoryCursor = Phaser.Math.Clamp(this.inventoryCursor + dir, 0, max);
                } else {
                    const wh = WAREHOUSE[this.slotIndex];
                    const max = wh.length - 1;
                    if (max < 0) return;
                    this.warehouseCursor = Phaser.Math.Clamp(this.warehouseCursor + dir, 0, max);
                }
                this.refreshDisplay();
            }

            switchPanel(panel) {
                this.activePanel = panel;
                this.refreshDisplay();
            }

            transferItem() {
                if (this.activePanel === 'inventory') {
                    const item = this.inventory[this.inventoryCursor];
                    if (!item) return;
                    if (this.isEquipped(item)) return;
                    this.inventory.splice(this.inventoryCursor, 1);
                    WAREHOUSE[this.slotIndex].push(item);
                    if (this.inventoryCursor >= this.inventory.length && this.inventoryCursor > 0) {
                        this.inventoryCursor--;
                    }
                } else {
                    const wh = WAREHOUSE[this.slotIndex];
                    const item = wh[this.warehouseCursor];
                    if (!item) return;
                    if (this.inventory.length >= 8) {
                        this.showWarning();
                        return;
                    }
                    wh.splice(this.warehouseCursor, 1);
                    this.inventory.push(item);
                    if (this.warehouseCursor >= wh.length && this.warehouseCursor > 0) {
                        this.warehouseCursor--;
                    }
                }
                this.refreshDisplay();
            }

            showWarning() {
                this.warningText.setVisible(true);
                this.warningTimer = this.time.now + 1800;
            }

            saveAndBack() {
                this.saveToStorage();
                this.scene.start('BaseMenuScene', { slotIndex: this.slotIndex });
            }

            update(time, delta) {
                if (this.warningTimer > 0 && this.time.now > this.warningTimer) {
                    this.warningText.setVisible(false);
                    this.warningTimer = 0;
                }

                const pads = this.input.gamepad.gamepads;
                if (pads && pads.length > 0 && this.time.now > (this.game.registry.get('_padTimer') || 0)) {
                    const pad = this.input.gamepad.getPad();
                    if (pad) {
                        const axisY = pad.axes.length > 1 ? pad.axes[1].getValue() : 0;
                        const axisX = pad.axes.length > 0 ? pad.axes[0].getValue() : 0;
                        const dpadUp = pad.up || axisY < -0.5;
                        const dpadDown = pad.down || axisY > 0.5;
                        const dpadLeft = pad.left || axisX < -0.5;
                        const dpadRight = pad.right || axisX > 0.5;

                        if (dpadUp && this.prevAxisY >= -0.5) {
                            this.moveCursor(-1);
                            this.game.registry.set('_padTimer', this.time.now + 150);
                        } else if (dpadDown && this.prevAxisY <= 0.5) {
                            this.moveCursor(1);
                            this.game.registry.set('_padTimer', this.time.now + 150);
                        } else if (dpadLeft && !this.prevDpadLeft) {
                            this.switchPanel('inventory');
                            this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        } else if (dpadRight && !this.prevDpadRight) {
                            this.switchPanel('warehouse');
                            this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        }

                        const confirm = pad.A;
                        const cancel = pad.B;

                        if (confirm && this.prevConfirm === false) {
                            this.transferItem();
                        }
                        if (cancel && this.prevCancel === false) {
                            this.saveAndBack();
                        }

                        if ((!this.prevConfirm && confirm) || (!this.prevCancel && cancel)) {
                            this.game.registry.set('_padTimer', this.time.now + PAD_DEBOUNCE_MS);
                        }

                        this.prevConfirm = confirm;
                        this.prevCancel = cancel;
                        this.prevAxisY = axisY;
                        this.prevAxisX = axisX;
                        this.prevDpadLeft = dpadLeft;
                        this.prevDpadRight = dpadRight;
                    }
                }
            }
        }

                    g.fillStyle(0x778877, 0.35);
                    for (let i = 0; i < 80; i++) {
                        const w = Phaser.Math.Between(30, 100);

                        const x = Phaser.Math.Between(-120, fogWidth + 120);

                        g.fillRect(x, y, w, h);

                    const cx = size / 2;
                    const cy = size / 2 + 4;
                    const rOuter = 10;
                    const rInner = 6;
                    g.strokeCircle(cx, cy, rOuter);
                    g.lineStyle(2, 0x5b7cff, 0.9);
                    g.strokeCircle(cx, cy, rInner);
                    g.fillStyle(0x3b4c99, 0.5);
                    g.fillCircle(cx, cy, 4);
                    g.lineStyle(1, 0x8fb5ff, 0.8);
                    for (let i = 0; i < 3; i++) {

                });

                // 攻撃判定（オーバーラップ）
                this.physics.add.overlap(this.player.attackHitboxes, this.enemies, (hitbox, enemy) => {
                    if (hitbox.body.enable) {
                        if (!enemy.invulnerable) {
                            // Calculate Base Damage
                            let baseDmg = 5; // Unarmed
                            if (this.player.equippedWeapon && this.player.equippedWeapon.attackPower) {
                                baseDmg = this.player.equippedWeapon.attackPower;
                            }
                            
                            // Apply Random Variance (+/- 10%)
                            const variance = Math.floor(baseDmg * 0.1) + 1;
                            let dmg = Math.floor(baseDmg + Phaser.Math.Between(-variance, variance));
                            if (dmg < 1) dmg = 1;
                            
                            // 覚醒時はダメージ1.5倍
                            if (this.player.isEmpowered) {
                                dmg = Math.floor(dmg * 1.5);
                            }
                            
                            const critChance = typeof this.player.critChance === 'number' ? this.player.critChance : 0.1;
                            const isPlayerCritical = Math.random() < critChance;
                            if (isPlayerCritical) {
                                const critMul = 1.5 * (1 + (this.player.critDamageBonus || 0) / 100);
                                dmg = Math.floor(dmg * critMul);
                            }

                            // 攻撃タイプとヒットストップ時間を取得
                            const attackType = hitbox.attackType || this.player.attackType || 'light';
                            const customHitStop = hitbox.hitStopDuration !== undefined ? hitbox.hitStopDuration : 0;

                            // attackTypeを渡してヒットストップの時間を制御
                            if (this.player.isEmpowered && attackType.startsWith('light')) {
                                // 覚醒弱攻撃: ゆっくり多段ヒット (1ヒットあたりのダメージを下げて、連続ヒットさせる)
                                // ここでは簡易的に、1回のオーバーラップ判定で複数回ダメージを与える処理を行う
                                // ヒットストップと組み合わせて「ザクッ…ザクッ…」感を出す
                                
                                const hitCount = 3;
                                const interval = 100; // ms
                                const damagePerHit = Math.ceil(dmg / 2); // ダメージは少し下げるが合計は増える

                                for(let i=0; i<hitCount; i++) {
                                    this.time.delayedCall(i * interval, () => {
                                        if (enemy.active && enemy.hp > 0) {
                                            // 多段ヒット時は個別のヒットストップを使用（あるいは分割）
                                            // ここではcustomHitStopがあればそれを使うが、多段なので少し短くするなどの調整も可
                                            // 今回はそのまま渡す
                                            enemy.takeDamage(damagePerHit, attackType, customHitStop, isPlayerCritical);
                                            // 毎回ヒットストップを入れることで「重い」感じを出す
                                            // 覚醒多段なので、個別のstopは少し短めにする（全体のテンポ維持のため）
                                            // ただしcustomHitStopが指定されている場合はそれを尊重する
                                            const stop = customHitStop > 0 ? customHitStop : 80;
                                            this.hitStop(stop); 
                                        }
                                    });
                                }
                                
                                // 無敵時間を少し長めにとって、多段ヒット終了まで次の攻撃を受けないようにする
                                enemy.invulnerable = true;
                                this.time.delayedCall(interval * hitCount + 100, () => enemy.invulnerable = false);

                            } else {
                                // 通常処理
                                enemy.takeDamage(dmg, attackType, customHitStop, isPlayerCritical);
                                
                                enemy.invulnerable = true;
                                this.time.delayedCall(300, () => enemy.invulnerable = false);
                            }
                            
                            // 血のエフェクト計算
                            // 物理挙動っぽく、攻撃のベクトルに合わせて血を飛ばす
                            const angleToEnemy = Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y);
                            let bloodAngle = angleToEnemy;
                            // 基本速度（勢いよく）
                            let speedMin = 150;
                            let speedMax = 350;
                            let spread = 30;

                            if (this.player.attackType === 'light') {
                                // 弱攻撃（時計回りスイング）
                                bloodAngle += Phaser.Math.DegToRad(45);
                                spread = 45; // 拡散広め
                            } else {
                                // 強攻撃（突き）
                                spread = 15; // 拡散狭め
                                speedMin = 250;
                                speedMax = 500; 
                            }

                            // パーティクルエミッターの代わりにBloodDropを生成
                            // 数を減らして、敵周辺に散らばるようにする
                            const dropCount = Phaser.Math.Between(8, 15);
                            for(let i=0; i<dropCount; i++) {
                                // get()は非アクティブなオブジェクトがあれば再利用し、なければ新規作成する
                                const drop = this.bloodDrops.get(enemy.x, enemy.y, 'blood');
                                if (drop) {
                                    let angle, speed, zSpeed;

                                    // 敵の周辺に小さい赤の四角を散らせて床に残す
                                    // ほとんど（80%）は敵の足元周辺にポロポロ落ちる
                                    if (Math.random() < 0.8) {
                                        // 近くに落ちる
                                        angle = Phaser.Math.FloatBetween(0, Math.PI * 2); // 全方向
                                        speed = Phaser.Math.Between(10, 60); // 超低速
                                        zSpeed = Phaser.Math.Between(30, 100); // ほとんど跳ねない
                                    } else {
                                        // 少しだけ飛ぶ（攻撃方向）
                                        angle = bloodAngle + Phaser.Math.DegToRad(Phaser.Math.Between(-spread, spread));
                                        speed = Phaser.Math.Between(speedMin * 0.5, speedMax * 0.5); // 速度も抑えめ
                                        zSpeed = Phaser.Math.Between(100, 250);
                                    }
                                    
                                    // 座標を明示的に渡して初期化・起動
                                    drop.launch(enemy.x, enemy.y, angle, speed, zSpeed);
                                }
                            }

                            
                            // ノックバック (修正: takeKnockbackを使用)
                            // 多段ヒット中はノックバックさせない（最後のヒットで吹っ飛ぶようにするか、あるいは毎回少しずれるか）
                            // ここでは多段ヒット中もノックバックさせるが、ヒットストップで止まるので不自然ではないはず
                            if (enemy.body) {
                                const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y);
                                const baseForce = 300;
                                const extra = (this.player.knockbackBonus || 0) * 25;
                                const vec = new Phaser.Math.Vector2().setToPolar(angle, baseForce + extra);
                                enemy.takeKnockback(vec.x, vec.y, 250);
                            }
                        }
                    }
                });

                // デバッグ表示切り替え (F2)

                    for (const [id, shield] of entries) {

                        const typeId = parseInt(id, 10);
                        const itemData = {
                            id: Date.now() + Math.random().toString(36).substr(2, 9),

                            type: 'shield',
                            rarity: RARITY.NORMAL,
                            name: shield.name,

                        const drop = new ItemDrop(this, centerX, centerY, 'shield', itemData);

                        this.items.add(drop);

                    this.showText("Dropped All Shields!");

                // Item Info Popup
                this.itemPopup = this.add.container(0, 0);

                const popupBg = this.add.graphics();

            createButton(x, y, color, label, callback) {
                const zone = this.add.zone(x, y, 64, 64);
                this.physics.add.existing(zone, true); // Static body

                // 見た目
                const graphics = this.add.graphics();
                graphics.fillStyle(color, 0.5);
                graphics.fillRect(x - 32, y - 32, 64, 64);
                graphics.lineStyle(2, 0xffffff, 1);
                graphics.strokeRect(x - 32, y - 32, 64, 64);
                
                const text = this.add.text(x, y, label, { 
                    fontFamily: 'x10y12pxDonguriDuel', 
                    fontSize: '16px', 
                    color: '#ffffff',
                    align: 'center'
                }).setOrigin(0.5);

                if (!this.testButtons) {
                    this.testButtons = [];
                }
                this.testButtons.push({ zone, graphics, text });

                // プレイヤーとのインタラクション
                this.physics.add.overlap(this.player, zone, () => {
                    // クールダウン制御（簡易的）
                    if (!zone.lastTriggerTime || this.time.now - zone.lastTriggerTime > 2000) {
                        zone.lastTriggerTime = this.time.now;
                        
                        // エフェクト
                        this.tweens.add({
                            targets: [graphics, text],
                            scaleX: 1.2,
                            scaleY: 1.2,
                            duration: 100,
                            yoyo: true
                        });
                        
                        callback();
                    }
                });

                this.dungeonType = this.dungeonType || 'story';
                if (this.dungeonType === 'story') {
                    this.dungeonFloor = 1;
                    this.isTowerMode = false;
                    this.dungeonTheme = 'forest';
                    this.showFloorBanner(() => {
                        this.enterForestDungeon();
                    });
                } else if (this.dungeonType === 'tutorial') {
                    this.dungeonFloor = 1;
                    this.isTowerMode = false;
                    this.dungeonTheme = 'forest';
                    this.showFloorBanner(() => {
                        this.enterForestDungeon();
                    });
                } else if (this.dungeonType === 'end') {
                    this.dungeonFloor = 21;
                    this.isTowerMode = true;
                    this.dungeonTheme = 'castle';
                    this.showFloorBanner(() => {
                        this.enterCastleDungeon();
                    });
                }
            }

            showFloorBanner(onComplete) {
                if (this.floorBannerOverlay) {
                    this.floorBannerOverlay.destroy();
                    this.floorBannerOverlay = null;
                }
                if (this.floorBannerText) {
                    this.floorBannerText.destroy();
                    this.floorBannerText = null;
                }
                this.isFloorTransition = true;
                const w = this.scale.width;
                const h = this.scale.height;
                const overlay = this.add.rectangle(0, 0, w, h, 0x000000, 1);
                overlay.setOrigin(0, 0);
                overlay.setScrollFactor(0);
                overlay.setDepth(9000);
                let baseName = 'テストルーム';
                let floor = this.dungeonFloor || 1;
                if (this.dungeonTheme === 'forest') {
                    baseName = 'よどみの　じゅかい';
                } else if (this.dungeonTheme === 'castle') {
                    baseName = this.isTowerMode ? 'だんざいの　せんとう' : 'たそがれの　はいじょう';
                }
