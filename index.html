<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inishie Arena Prototype</title>
    <link rel="stylesheet" href="css/game.css">
    <script src="js/errors.js"></script>
        <script src="./phaser.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div style="font-family: 'x10y12pxDonguriDuel'; position: absolute; left: -9999px; visibility: hidden;">Font Loader</div>
    <div id="game-container"></div>
    <div id="error-log"></div>
    <details id="controller-help" style="position:fixed;left:12px;bottom:10px;z-index:20;background:#111e;padding:8px 12px;border:1px solid #666;font:12px/1.7 sans-serif;max-width:calc(100vw - 48px)">
      <summary style="cursor:pointer">コントローラー操作 <span id="pad-status">接続後にボタンを押してください</span></summary>
      <div>左スティック：移動 ／ 十字キー：メニュー選択・上で回復</div>
      <div>A / ×：決定・拾う ／ B / ○：戻る・回避</div>
      <div>X / □：弱攻撃 ／ Y / △：強攻撃</div>
      <div>LB / L1：ガード ／ RB / R1＋攻撃：強化攻撃 ／ RT / R2：向き固定</div>
      <div>Start / OPTIONS：所持品 ／ LT / L2：アイテム説明切替（探索）</div>
      <div>Xbox・PlayStation系の標準マッピング対応。キーボード操作も利用できます。</div>
    </details>

        <script src="js/data.js"></script>
    <script src="js/ui/HUD.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/objects.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/ItemDrop.js"></script>
    <script src="js/scenes/menus.js"></script>
    <script src="js/scenes/MainScene.js"></script>
    <script src="js/scenes/SurvivalScene.js"></script>
    <script src="js/bootstrap.js"></script>
</body>
</html>
